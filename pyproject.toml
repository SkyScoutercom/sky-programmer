[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sky-programmer"
version = "0.1.5"
description = "SKY programmer: SkyScouter's terminal and desktop tool for reading and configuring VESC motor controllers"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8; python_version >= '3.12'"]
dev = ["pytest>=8", "pytest-cov", "ruff", "PySide6-Essentials>=6.8; python_version >= '3.12'"]

[project.scripts]
sky = "sky_programmer.cli:main"

[project.gui-scripts]
sky-gui = "sky_programmer.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sky_programmer = ["layouts/*.json", "gui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
